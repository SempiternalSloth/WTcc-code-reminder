name: Package Extension

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Extension Zip
        uses: thewebimp/chrome-extension-packager@v2
        with: '.' 
        extension_dir: '.' 
        zip_name: 'my-chrome-extension.zip'

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: Gaijin%20Store%20Partner%20HUD.zip
          path: Gaijin%20Store%20Partner%20HUD.zip
