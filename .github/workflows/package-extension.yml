name: Package Extension

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Extension Zip
        uses: thewebimp/chrome-extension-packager@v2
        with: '.' 
        extension_dir: '.' 
        zip_name: 'Gaijin Store Partner HUD.zip'

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: Gaijin Store Partner HUD.zip
